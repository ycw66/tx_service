name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: reproduce_steps
    attributes:
      label: Reproduce steps
      description: Please describe steps of reproducing the bug.
    validations:
      required: true
 - type: textarea
   id: expected_result
   attributes:
     label: Expected result
     description: Please describe the right result as expected.
   validations:
     required: true
  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      description: Please describe the incorrect result actually happened.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of the software are you running?
      options:
        - 0.0.1 (Default)
    validations:
      required: true
  - type: textarea
    id: related_issues
    attributes:
      label: Related issues
      description: References to the related issues
      placeholder: e.g. monographdb/repository#number
  - type: textarea
    id: root_cause_analysis
    attributes:
      label: Root cause analysis
      description: Please give a cause analysis of the bug.(This is for developer)
  - type: textarea
    id: how_to_fix
    attributes:
      label: How to fix
      description: Please describe the possible approaches to fix and the rationale of the choice.(This is for developer)
