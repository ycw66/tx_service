syntax="proto3";
package txservice.remote;

option cc_generic_services = true;

message ConnectRequest {
  string message = 1;
};

message ConnectResponse {
  string message = 1;
};

message TransferRequest {
  uint32 ng_id = 1;
}

message TransferResponse {
  bool error = 1;
}

message CheckTxStatusRequest {
	uint64 tx_number = 1;
	int64 tx_term = 2;
}

message CheckTxStatusResponse {
    enum TxStatus {
		NOT_FOUND = 0;
		ONGOING = 1;
		COMMITTED = 2;
		ABORTED = 3;
	}
	TxStatus tx_status = 1;
}

// New leader notify its node_id to other nodes.
message NotifyNewLeaderStartRequest {
  uint32 ng_id = 1;
  uint32 node_id = 2;
}

message NotifyNewLeaderStartResponse {
  bool error = 1;
}

service CcStreamService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
};

service CcRpcService {
	rpc Transfer(TransferRequest) returns (TransferResponse);
	rpc CheckTxStatus(CheckTxStatusRequest) returns (CheckTxStatusResponse);
	rpc NotifyNewLeaderStart(NotifyNewLeaderStartRequest) returns (NotifyNewLeaderStartResponse);
}

message TxId_msg {
	uint32 core_id = 1;
	uint32 ident = 2;
	uint64 vec_idx = 3;
}

message CceAddr_msg {
	oneof entry_ptr {
		uint64 cce_ptr = 1;
		uint64 insert_ptr = 2;
	}
	int64 term = 3;
}

enum IsolationType {
	ReadCommitted = 0;
	SnapshotIsolation = 1;
	RepeatableRead = 2;
	Serializable = 3;
}

enum CcProtocolType {
	Occ = 0;
	Locking = 1;
}

enum CommitType {
	PrepareCommit = 0;
	PostCommit = 1;
}

message AcquireRequest {
	uint32 src_node_id = 1;
	string tablename = 2;
	bytes key = 3;
	uint32 key_shard_code = 4;
	uint32 vec_idx = 5;
	uint64 ts = 6;
	bool insert = 7;
	CcProtocolType protocol = 8;
}

message AcquireResponse {
	int32 error_code = 1;
	uint64 vali_ts = 2;
	uint64 commit_ts = 3;
	CceAddr_msg cce_addr = 4;
	// The response is an acknowledgement or the result
	bool is_ack = 5;
}

message AcquireAllRequest {
	uint32 src_node_id = 1;
	string tablename = 2;
	bytes key = 3;
	uint32 node_group_id = 4;
	bool insert = 5;
	CcProtocolType protocol = 6;
	bool is_write_intent = 7;
}

message AcquireAllResponse {
	int32 error_code = 1;
	uint64 vali_ts = 2;
	uint64 commit_ts = 3;
	int64 node_term = 4;
	// The response is an acknowledgement or the result
	bool is_ack = 5;
}

message ValidateRequest {
	uint32 src_node_id = 1;
	uint32 node_group_id = 2;
	CceAddr_msg cce_addr = 3;
	uint64 commit_ts = 4;
	uint64 key_ts = 5;
	uint64 gap_ts = 6;
	CcProtocolType protocol = 7;
}

message ValidateResponse {
	int32 error_code = 1;
	repeated TxId_msg txs = 2;
}

message PostprocessResponse {
	int32 error_code = 1;
}

message ReadRequest {
	uint32 src_node_id = 1;
	string tablename = 2;
	bytes key = 3;
	uint32 key_shard_code = 4;
	bytes record = 5;
	enum ReadType {
		INSIDE = 0;
		OUTSIDE_NORMAL = 1;
		OUTSIDE_DELETED = 2;
	}
	ReadType read_type = 6;
	uint64 ts = 7;
	IsolationType iso_level = 8;
	CcProtocolType protocol = 9;
}

message ReadResponse {
	int32 error_code = 1;
	bytes record = 2;
	enum RecordStatus {
		NORMAL = 0;
		UNKNOWN = 1;
		DELETED = 2;
	}
	RecordStatus rec_status = 3;
	uint64 ts = 4;
	CceAddr_msg cce_addr = 5;
	// The response is an acknowledgement or the result
	bool is_ack = 6;
}

message ReadOutsideRequest {
    uint32 node_group_id = 1;
	bytes record = 2;
	bool is_deleted = 3;
	CceAddr_msg cce_addr = 4;
}

message PostCommitRequest {
	uint32 src_node_id = 1;
	uint32 node_group_id = 2;
	CceAddr_msg cce_addr = 3;
	uint64 commit_ts = 4;
	bytes record = 5;
	bool is_deleted = 6;
}

message PostWriteAllRequest {
	uint32 src_node_id = 1;
	string tablename = 2;
	uint32 node_group_id = 3;
	bytes key = 4;
	uint64 commit_ts = 5;
	bytes record = 6;
	bool is_deleted = 7;
	CommitType commit_type = 8;
}

message ScanTuple_msg {
	bytes key = 1;
	bytes record = 2;
	enum RecordStatus {
		NORMAL = 0;
		UNKNOWN = 1;
		DELETED = 2;
	}
	RecordStatus rec_status = 3;
	uint64 key_ts = 4;
	uint64 gap_ts = 5;
	CceAddr_msg cce_addr = 6;
}

message ScanOpenRequest {
	uint32 src_node_id = 1;
	uint32 shard_id = 2;
	string tablename = 3;
	oneof start_key {
		bytes key = 4;
		bool neg_inf = 5;
		bool pos_inf = 6;
	}
	bool inclusive = 7;
	bool direction = 8;
	uint64 ts = 9;
	bool ckpt = 10;
	IsolationType iso_level = 11;
	CcProtocolType protocol = 12;
}

message ScanCache_msg {
	repeated ScanTuple_msg scan_tuple = 1;
}

message ScanOpenResponse {
	int32 error_code = 1;
	uint32 node_group_id = 2;
	repeated ScanCache_msg scan_cache = 3;
}

message ScanNextRequest {
	uint32 src_node_id = 1;
	uint32 node_group_id = 2;
	uint64 prior_cce_ptr = 3;
	bool direction = 4;
	uint64 ts = 5;
	uint64 scan_cache_ptr = 6;
	bool ckpt = 7;
	IsolationType iso_level = 8;
	CcProtocolType protocol = 9;
}

message ScanNextResponse {
	int32 error_code = 1;
	repeated ScanTuple_msg scan_tuple = 2;
	uint64 scan_cache_ptr = 3;
}

message CommitSkRequest {
	uint32 src_node_id = 1;
	string tablename = 2;
	bytes sk = 3;
	bytes pk = 4;
	uint32 key_shard_code = 5;
	uint64 ts = 6;
	bool is_deleted = 7;
}

message FaultInjectRequest {
  uint32 src_node_id = 1;
  string fault_name = 2;
  string fault_paras = 3;
}

message FaultInjectResponse {
  int32 error_code = 1;
}

message CcMessage {
	enum MessageType {
		Shutdown = 0;
		AcquireRequest = 2;
		AcquireResponse = 3;
		ReadRequest = 4;
		ReadResponse = 5;
		ValidateRequest = 6;
		ValidateResponse = 7;
		PostprocessResponse = 8;
		PostCommitRequest = 10;
		ScanOpenRequest = 12;
		ScanOpenResponse = 13;
		ScanNextRequest = 14;
		ScanNextResponse = 15;
		CommitSkRequest = 16;
		ReadOutsideRequest = 17;
		FaultInjectRequest = 26;
		FaultInjectResponse = 27;
		AcquireAllRequest = 28;
		AcquireAllResponse = 29;
		PostWriteAllRequest = 30;
	}

	MessageType type = 1;
	uint64 tx_number = 2;
	uint64 handler_addr = 3;
	int64 tx_term = 4;

	oneof content {
		AcquireRequest acquire_req = 10;
		AcquireResponse acquire_resp = 11;
		ReadRequest read_req = 12;
		ReadResponse read_resp = 13;
		ValidateRequest validate_req = 14;
		ValidateResponse validate_resp = 15;
		PostprocessResponse post_resp = 16;
		PostCommitRequest postcommit_req = 18;
		ScanOpenRequest scan_open_req = 20;
		ScanOpenResponse scan_open_resp = 21;
		ScanNextRequest scan_next_req = 22;
		ScanNextResponse scan_next_resp = 23;
		CommitSkRequest commit_sk_req = 24;
		ReadOutsideRequest read_outside_req = 25;
		FaultInjectRequest fault_inject_req = 34;
		FaultInjectResponse fault_inject_resp= 35;
		AcquireAllRequest acquire_all_req = 36;
		AcquireAllResponse acquire_all_resp = 37;
		PostWriteAllRequest post_write_all_req = 38;
	}
}
