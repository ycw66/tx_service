syntax="proto3";
package txservice.store;

message SamplePool
{
  int32 capacity = 1;
  int32 c1 = 2;
  int32 c2 = 3;
  repeated bytes samples = 4;
}

message IndexStatistics {
  int32 table_type = 1;
  string table_name = 2;
  int64 records = 3;
  SamplePool sample_pool = 4;
}

message Statistics {
  repeated IndexStatistics index_statistics_list = 1;
}